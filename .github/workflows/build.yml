name: Build and test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libssl-dev rpm python3-cryptography
      - name: Fetch private dependency and build
        env:
          GH_TOKEN: ${{ github.token }}
          JWT_SOURCE_SSH_KEY: ${{ secrets.JWT_SOURCE_SSH_KEY }}
        run: bash scripts/ci-build.sh
      - name: Test
        run: bash scripts/test.sh
      - name: Package RPM
        run: bash scripts/rpm.sh
      - name: Verify RPM permissions and contents
        run: python3 tests/package.py dist/sqlite-viewer-0.2.0-1.x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-viewer-x86_64
          path: dist/*.rpm
          if-no-files-found: error
      - name: Runtime archive
        run: tar -czf sqlite-viewer-linux-x86_64.tar.gz -C dist bin share
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-viewer-runtime
          path: sqlite-viewer-linux-x86_64.tar.gz
